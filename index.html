<head>

<style>
:root{--navy:#102a43;--dark:#0b1f33;--amber:#f5b700;--bg:#f5f7fa;--card:#fff;--text:#172b4d;--muted:#64748b;--line:#e2e8f0;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--dark)}.login-side{padding:7vw;color:#fff;display:flex;flex-direction:column;justify-content:center}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:20px}.brandmark{width:42px;height:42px;border-radius:12px;background:var(--amber);color:var(--dark);display:grid;place-items:center}.login-side h1{font-size:clamp(32px,5vw,58px);line-height:1.05;margin:35px 0 18px}.login-side p{color:#cbd5e1;max-width:560px;line-height:1.7}.login-box{background:#fff;margin:5vw;border-radius:24px;padding:clamp(28px,5vw,55px);align-self:center;box-shadow:0 25px 70px #0004}.login-box h2{margin:0 0 8px;font-size:30px}.login-box>p{color:var(--muted);margin-bottom:28px}.field{margin:0 0 16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff;color:var(--text)}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px #f5b70022}.btn{padding:10px 14px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--text);font-weight:700}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.amber{background:var(--amber);color:var(--dark);border-color:var(--amber)}.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}.demo{margin-top:20px;padding:12px;background:#f8fafc;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.6}
.app{display:flex;min-height:100vh}.sidebar{width:255px;background:var(--dark);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:30;display:flex;flex-direction:column}.side-brand{padding:4px 10px 25px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;background:transparent;color:#cbd5e1;text-align:left;border-radius:9px}.nav button:hover,.nav button.active{background:#fff12;color:#fff}.nav button.active{background:#173b5c}.side-bottom{margin-top:auto}.content{margin-left:255px;width:calc(100% - 255px)}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.top-left{display:flex;align-items:center;gap:12px}.mobile-menu{display:none}.user-mini{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#e8eef5;display:grid;place-items:center;font-weight:800}.main{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.page-head h1{margin:0 0 6px;font-size:28px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat .ico{width:36px;height:36px;border-radius:9px;background:#f3f6f9;display:grid;place-items:center;margin-bottom:14px}.stat b{font-size:25px;display:block}.stat span{font-size:13px;color:var(--muted)}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.card h3,.card h4{margin:0 0 10px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.searchbar{display:grid;grid-template-columns:1fr 180px 180px auto;gap:10px;margin-bottom:18px}.pkls{grid-template-columns:repeat(3,1fr)}.pkl{padding:18px}.pkl .top{display:flex;justify-content:space-between;gap:12px}.pkl h3{margin:4px 0 6px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag,.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f7;color:#475569}.badge.wait{background:#fff4d6;color:#a16207}.badge.ok{background:#dcfce7;color:#166534}.badge.no{background:#fee2e2;color:#991b1b}.badge.info{background:#e0f2fe;color:#075985}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.timeline{border-left:2px solid #dbe3eb;margin:14px 0 0 8px;padding-left:18px}.timeline .item{position:relative;margin-bottom:18px}.timeline .item:before{content:"";position:absolute;left:-25px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--amber)}.empty{text-align:center;padding:35px;color:var(--muted)}.notice{padding:12px;border-left:3px solid var(--amber);background:#fffbeb;border-radius:8px;font-size:13px}.modal-back{position:fixed;inset:0;background:#0b1f3377;display:grid;place-items:center;z-index:60;padding:20px}.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:100;display:grid;gap:8px}.toast{background:var(--dark);color:#fff;padding:12px 15px;border-radius:10px;box-shadow:0 10px 30px #0003;font-size:13px}.toast.ok{border-left:4px solid var(--ok)}.toast.bad{border-left:4px solid var(--danger)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kv{padding:12px;background:#f8fafc;border-radius:10px}.kv small{display:block;color:var(--muted);margin-bottom:4px}.hero{background:var(--navy);color:#fff;border-radius:16px;padding:25px;margin-bottom:20px}.hero p{color:#d7e2ee;max-width:700px}.profile{display:grid;grid-template-columns:180px 1fr;gap:22px}.profile-avatar{width:130px;height:130px;border-radius:20px;background:#e9eef4;display:grid;place-items:center;font-size:40px;font-weight:800}.stars{letter-spacing:2px;color:#d08b00}.list{display:grid;gap:10px}.list-item{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}.footer-note{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.pkls{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr 1fr}.searchbar .wide{grid-column:1/-1}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.content{margin-left:0;width:100%}.mobile-menu{display:inline-flex}.topbar{padding:0 16px}.main{padding:18px}.stats,.pkls,.three{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}.detail-grid,.profile{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login-side{display:none}.login-box{margin:18px}.page-head{flex-direction:column}}
</style>
</head>

<script>
const KEYS=['users','currentUser','tempatPKL','pengajuan','monitoring','penilaian','pengalaman','ulasan','notifikasi'];
const DEMO_USERS=[
{id:'u-siswa',name:'Tyas Syafa Pratiwi',email:'siswa@sekolah.sch.id',password:'password123',role:'siswa',nis:'2513025042',jurusan:'Rekayasa Perangkat Lunak'},
{id:'u-guru',name:'Guru Pembimbing',email:'guru@sekolah.sch.id',password:'password123',role:'guru',jurusan:''},
{id:'u-alumni',name:'Alumni Demo',email:'alumni@sekolah.sch.id',password:'password123',role:'alumni',jurusan:'Rekayasa Perangkat Lunak'}
];
const DEMO_PLACES=[
{id:'p1',name:'GiNK Technology',location:'Pahoman, Bandar Lampung',city:'Bandar Lampung',field:'Teknologi Informasi',jurusan:['RPL','TKJ','Multimedia','Desain Grafis'],status:'Perlu konfirmasi sekolah',description:'Perusahaan teknologi yang informasinya tersedia untuk rujukan pencarian tempat PKL.',activities:'Web development, aplikasi, konten digital, dan kegiatan teknologi sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true},
{id:'p2',name:'Almaira Studio',location:'Bandar Lampung',city:'Bandar Lampung',field:'Teknologi & Kreatif',jurusan:['RPL','TKJ','Multimedia','Desain Grafis'],status:'Perlu konfirmasi sekolah',description:'Data tempat rujukan bidang teknologi dan kreatif untuk pencarian PKL.',activities:'Software, website, desain, multimedia, jaringan, dan kegiatan digital sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true},
{id:'p3',name:'Ventura Studios',location:'Kedaton, Bandar Lampung',city:'Bandar Lampung',field:'Multimedia & Desain',jurusan:['Multimedia','Desain Grafis'],status:'Perlu konfirmasi sekolah',description:'Tempat rujukan bidang kreatif dan multimedia.',activities:'Animasi, desain grafis, dan produksi multimedia sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true},
{id:'p4',name:'PT Indonesia Trans Network',location:'Bandar Lampung',city:'Bandar Lampung',field:'Jaringan & Teknologi',jurusan:['TKJ','RPL'],status:'Perlu konfirmasi sekolah',description:'Tempat rujukan bidang jaringan dan teknologi informasi.',activities:'Jaringan, internet, dan infrastruktur teknologi sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true},
{id:'p5',name:'PT Fiberwave Siger Indonesia',location:'Bandar Lampung',city:'Bandar Lampung',field:'Telekomunikasi & Jaringan',jurusan:['TKJ'],status:'Perlu konfirmasi sekolah',description:'Tempat rujukan bidang konektivitas dan jaringan.',activities:'Infrastruktur jaringan dan telekomunikasi sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true},
{id:'p6',name:'Newus Technology',location:'Bandar Lampung',city:'Bandar Lampung',field:'Software & Teknologi',jurusan:['RPL','TKJ'],status:'Perlu konfirmasi sekolah',description:'Tempat rujukan bidang software dan konsultasi teknologi.',activities:'Website, aplikasi, software, dan kegiatan TI sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true},
{id:'p7',name:'PT Acosys Global Data',location:'Bandar Lampung',city:'Bandar Lampung',field:'Software & Digital',jurusan:['RPL','Multimedia','Desain Grafis'],status:'Perlu konfirmasi sekolah',description:'Tempat rujukan bidang software dan layanan digital.',activities:'Software, digital signage, video promosi, dan kegiatan digital sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true},
{id:'p8',name:'Vorta Labs',location:'Bandar Lampung',city:'Bandar Lampung',field:'Software & Digital Technology',jurusan:['RPL'],status:'Perlu konfirmasi sekolah',description:'Tempat rujukan bidang software dan teknologi digital.',activities:'Web, software, dan teknologi digital sesuai kebutuhan.',requirements:'Belum tersedia',quota:'Tidak dicantumkan',source:'Informasi publik; penerimaan PKL perlu dikonfirmasi sekolah.',active:true}
];
function seed(){if(!localStorage.getItem('users'))localStorage.setItem('users',JSON.stringify(DEMO_USERS));if(!localStorage.getItem('tempatPKL'))localStorage.setItem('tempatPKL',JSON.stringify(DEMO_PLACES));for(const k of KEYS.slice(3))if(!localStorage.getItem(k))localStorage.setItem(k,'[]')}
function get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function me(){return JSON.parse(localStorage.getItem('currentUser')||'null')}
function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg,type='ok'){const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;document.getElementById('toastWrap').appendChild(d);setTimeout(()=>d.remove(),2800)}
function roleName(r){return r==='guru'?'Guru Pembimbing/Admin':r==='alumni'?'Alumni':'Siswa'}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function badge(s){let c=s==='Diterima'||s==='Aktif'?'ok':s==='Ditolak'?'no':s==='Perlu konfirmasi sekolah'?'wait':'info';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function notify(userId,title,message){const n=get('notifikasi');n.unshift({id:uid('n'),userId,title,message,read:false,date:new Date().toISOString()});set('notifikasi',n)}
function route(page){if(!me())return showLogin();window.location.hash=page;renderPage(page)}
function allowed(page){const r=me()?.role;if(['kelola','pengajuan','monitoring','penilaian'].includes(page))return r==='guru';if(['pengalaman','ulasan'].includes(page))return r==='alumni';return true}
function showLogin(){document.getElementById('root').innerHTML='<div class="login"><div class="login-side"><div class="brand"><span class="brandmark"><i data-lucide="school"></i></span> PKL SMK</div><h1>Sistem Informasi Pemilihan dan Monitoring Tempat PKL</h1><p>Cari tempat PKL, ajukan, pantau perkembangan, dan bagikan pengalaman dalam satu sistem informasi sekolah.</p></div><div class="login-box"><h2>Masuk</h2><p>Gunakan akun demo untuk mencoba setiap role.</p><form onsubmit="login(event)"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="nama@sekolah.sch.id"></div><div class="field"><label>Kata sandi</label><input id="password" type="password" required placeholder="password123"></div><div class="field"><label>Role demo</label><select id="role"><option value="siswa">Siswa</option><option value="guru">Guru Pembimbing/Admin</option><option value="alumni">Alumni</option></select></div><button class="btn primary" style="width:100%;padding:13px">Masuk</button></form><div class="demo"><b>Akun demo</b><br>Siswa: siswa@sekolah.sch.id<br>Guru: guru@sekolah.sch.id<br>Alumni: alumni@sekolah.sch.id<br>Password semua akun: <b>password123</b></div></div></div>';lucide.createIcons()}
function login(e){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('password').value,role=document.getElementById('role').value;const u=get('users').find(x=>x.email.toLowerCase()===email&&x.password===pass&&x.role===role);if(!u)return toast('Email, kata sandi, atau role tidak sesuai.','bad');const safe={...u};delete safe.password;set('currentUser',safe);toast('Login berhasil');route('dashboard')}
function logout(){localStorage.removeItem('currentUser');showLogin();toast('Anda telah keluar')}
function nav(){const r=me().role;let items=[['dashboard','LayoutDashboard','Dashboard'],['tempat','Building2','Tempat PKL']];if(r==='siswa')items.push(['pengajuanSaya','FileText','Pengajuan Saya'],['monitorSaya','ClipboardCheck','Monitoring PKL'],['pengalamanBaca','BookOpen','Pengalaman Alumni']);if(r==='guru')items.push(['kelola','Settings2','Kelola Tempat PKL'],['pengajuan','FileText','Pengajuan Siswa'],['monitoring','ClipboardCheck','Monitoring PKL'],['penilaian','GraduationCap','Penilaian']);if(r==='alumni')items.push(['pengalaman','BookOpen','Pengalaman Saya'],['ulasan','Star','Ulasan & Rating']);items.push(['notifikasi','Bell','Notifikasi'],['profil','User','Profil']);return items}
function shell(active){const u=me(),notes=get('notifikasi').filter(n=>n.userId===u.id&&!n.read).length;document.getElementById('root').innerHTML='<div class="app"><aside class="sidebar" id="sidebar"><div class="side-brand"><div class="brand"><span class="brandmark"><i data-lucide="school"></i></span> PKL SMK</div></div><nav class="nav">'+nav().map(x=>'<button class="'+(x[0]===active?'active':'')+'" onclick="route(\''+x[0]+'\')"><i data-lucide="'+x[1]+'"></i><span>'+x[2]+'</span></button>').join('')+'</nav><div class="side-bottom"><button class="nav" style="width:100%" onclick="logout()"><span style="display:flex;gap:11px;align-items:center;padding:11px 12px;color:#cbd5e1"><i data-lucide="log-out"></i>Keluar</span></button></div></aside><section class="content"><header class="topbar"><div class="top-left"><button class="btn mobile-menu" onclick="document.getElementById(\'sidebar\').classList.toggle(\'open\')"><i data-lucide="menu"></i></button><div><b id="topTitle">'+(nav().find(x=>x[0]===active)?.[2]||'Dashboard')+'</b></div></div><div class="user-mini"><button class="btn" onclick="route(\'notifikasi\')"><i data-lucide="bell"></i> '+notes+'</button><div class="avatar">'+initials(u.name)+'</div><span class="muted">'+esc(u.name)+'</span></div></header><main class="main" id="page"></main></section></div>';lucide.createIcons()}
function renderPage(page){if(!me())return showLogin();if(!allowed(page)){toast('Akses tidak tersedia untuk role ini.','bad');return route('dashboard')}shell(page);const p=document.getElementById('page');({dashboard:dashboard,tempat:places,pengajuanSaya:myApplications,monitorSaya:myMonitoring,pengalamanBaca:readExperiences,kelola:managePlaces,pengajuan:teacherApplications,monitoring:teacherMonitoring,penilaian:assessment,pengalaman:alumniExperience,ulasan:reviews,notifikasi:notifications,profil:profile}[page]||dashboard)(p);lucide.createIcons()}
function stat(icon,n,label){return '<div class="stat"><div class="ico"><i data-lucide="'+icon+'"></i></div><b>'+n+'</b><span>'+label+'</span></div>'}
function dashboard(p){const u=me(), apps=get('pengajuan').filter(a=>a.userId===u.id), active=apps.filter(a=>a.status==='Diterima'), unread=get('notifikasi').filter(n=>n.userId===u.id&&!n.read).length;let html='<div class="page-head"><div><h1>Dashboard</h1><div class="muted">Selamat datang, '+esc(u.name)+'.</div></div></div>';if(u.role==='siswa'){const progress=active.length?60:0;html+='<div class="grid stats">'+stat('file-text',apps.length,'Pengajuan aktif')+stat('clock',apps.filter(a=>a.status==='Menunggu').length,'Menunggu persetujuan')+stat('clipboard-check',active.length,'PKL aktif')+stat('bell',unread,'Notifikasi belum dibaca')+'</div><div class="hero section"><h2>Temukan tempat PKL yang sesuai</h2><p>Cari berdasarkan jurusan, bidang, dan lokasi. Informasi penerimaan PKL tetap perlu dikonfirmasi sekolah.</p><button class="btn amber" onclick="route(\'tempat\')">Cari Tempat PKL</button></div><div class="grid two section"><div class="card"><div class="section-head"><h3>Progress PKL</h3><b>'+progress+'%</b></div><div style="height:9px;background:#e5e7eb;border-radius:99px"><div style="width:'+progress+'%;height:100%;background:var(--amber);border-radius:99px"></div></div><div class="footer-note">'+(active.length?'Status diterima. Monitoring dilakukan oleh guru pembimbing.':'Belum ada PKL aktif.')+'</div></div><div class="card"><h3>Notifikasi terbaru</h3>'+notificationList(u.id,3)+'</div></div>'}
else if(u.role==='guru'){const allApps=get('pengajuan'), places=get('tempatPKL'), mon=get('monitoring'), vals=get('penilaian');html+='<div class="grid stats">'+stat('users',new Set(allApps.filter(a=>a.status==='Diterima').map(a=>a.userId)).size,'Siswa PKL')+stat('clock',allApps.filter(a=>a.status==='Menunggu').length,'Pengajuan menunggu')+stat('activity',allApps.filter(a=>a.status==='Diterima').length,'PKL aktif')+stat('clipboard-check',mon.length,'Catatan monitoring')+'</div><div class="grid two section"><div class="card"><div class="section-head"><h3>Pengajuan terbaru</h3><button class="btn small" onclick="route(\'pengajuan\')">Lihat semua</button></div>'+teacherAppTable(allApps.slice(0,5))+'</div><div class="card"><h3>Ringkasan</h3><p class="muted">Tempat PKL aktif: <b>'+places.filter(x=>x.active).length+'</b></p><p class="muted">Penilaian tersimpan: <b>'+vals.length+'</b></p><p class="muted">Monitoring tersimpan: <b>'+mon.length+'</b></p></div></div>'}
else{html+='<div class="grid stats">'+stat('book-open',get('pengalaman').filter(x=>x.userId===u.id).length,'Pengalaman dibagikan')+stat('message-square',get('ulasan').filter(x=>x.userId===u.id).length,'Ulasan diberikan')+stat('star',get('ulasan').filter(x=>x.userId===u.id).reduce((s,x)=>s+x.rating,0),'Total bintang')+'</div><div class="hero section"><h2>Bagikan pengalaman PKL</h2><p>Bantu siswa berikutnya memahami kegiatan, kendala, solusi, dan tips selama PKL.</p><button class="btn amber" onclick="route(\'pengalaman\')">Bagikan Pengalaman</button></div>'}p.innerHTML=html;lucide.createIcons()}
function notificationList(uid,limit=99){const a=get('notifikasi').filter(n=>n.userId===uid).slice(0,limit);return a.length?'<div class="list">'+a.map(n=>'<div class="list-item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.message)+'</div></div>').join('')+'</div>':'<div class="empty">Tidak ada notifikasi baru.</div>'}
function places(p){p.innerHTML='<div class="page-head"><div><h1>Tempat PKL</h1><div class="muted">Cari tempat PKL berdasarkan jurusan, bidang, dan lokasi.</div></div></div><div class="card"><div class="searchbar"><input id="q" class="wide" placeholder="Cari nama, bidang, atau lokasi..." oninput="filterPlaces()"><select id="loc" onchange="filterPlaces()"><option>Semua</option><option>Bandar Lampung</option><option>Metro</option><option>Lampung Selatan</option><option>Lampung Tengah</option><option>Lampung Timur</option><option>Pringsewu</option><option>Pesawaran</option><option>Lampung Utara</option><option>Lampung Barat</option></select><select id="field" onchange="filterPlaces()"><option>Semua</option><option>RPL</option><option>TKJ</option><option>Multimedia</option><option>Desain Grafis</option><option>Administrasi</option><option>Bisnis dan Manajemen</option></select><button class="btn" onclick="document.getElementById(\'q\').value=\'\';document.getElementById(\'loc\').value=\'Semua\';document.getElementById(\'field\').value=\'Semua\';filterPlaces()">Reset</button></div><div id="placeList" class="grid pkls"></div></div>';filterPlaces()}

function showPlace(id){const x=get('tempatPKL').find(a=>a.id===id);if(!x)return;const ex=get('pengalaman').filter(a=>a.placeId===id),rv=get('ulasan').filter(a=>a.placeId===id),a=avg(id);openModal('Detail Tempat PKL','<div class="detail-grid"><div class="kv"><small>Nama</small><b>'+esc(x.name)+'</b></div><div class="kv"><small>Lokasi</small>'+esc(x.location)+'</div><div class="kv"><small>Bidang</small>'+esc(x.field)+'</div><div class="kv"><small>Jurusan relevan</small>'+x.jurusan.join(', ')+'</div><div class="kv"><small>Status informasi</small>'+badge(x.status)+'</div><div class="kv"><small>Rating</small>'+(a?a+' / 5':'Belum ada rating')+'</div></div><div class="section"><h4>Deskripsi</h4><p>'+esc(x.description)+'</p><h4>Kegiatan</h4><p>'+esc(x.activities)+'</p><h4>Persyaratan</h4><p>'+esc(x.requirements)+'</p><h4>Kuota</h4><p>'+esc(x.quota)+'</p><div class="notice">'+esc(x.source)+'</div></div><div class="section"><h4>Pengalaman Alumni</h4>'+(ex.length?ex.map(e=>'<div class="list-item"><b>'+esc(e.userName)+'</b><p>'+esc(e.kegiatan)+'</p><small class="muted">Kendala: '+esc(e.kendala||'Belum tersedia')+'<br>Solusi: '+esc(e.solusi||'Belum tersedia')+'<br>Tips: '+esc(e.tips||'Belum tersedia')+'</small></div>').join(''):'<p class="muted">Belum ada pengalaman dari alumni.</p>')+'</div><div class="section"><h4>Ulasan & Rating</h4>'+(rv.length?rv.map(r=>'<div class="list-item"><b>'+esc(r.userName)+'</b> <span class="stars">'+('★'.repeat(r.rating))+'</span><p>'+esc(r.text)+'</p></div>').join(''):'<p class="muted">Belum ada ulasan dari alumni.</p>')+'</div>',me().role==='siswa'?'<button class="btn amber" onclick="closeModal();applyPlace(\''+x.id+'\')">Ajukan PKL</button>':'');}
function applyPlace(id){if(me().role!=='siswa')return toast('Hanya siswa yang dapat mengajukan.','bad');const x=get('tempatPKL').find(a=>a.id===id),u=me();const existing=get('pengajuan').find(a=>a.userId===u.id&&a.placeId===id&&a.status!=='Ditolak');if(existing)return toast('Anda sudah memiliki pengajuan untuk tempat ini.','bad');openModal('Pengajuan PKL','<form onsubmit="submitApplication(event,\''+id+'\')"><div class="field"><label>Nama siswa</label><input value="'+esc(u.name)+'" readonly></div><div class="field"><label>NIS/NISN</label><input id="nis" value="'+esc(u.nis||'')+'" required></div><div class="field"><label>Jurusan</label><input value="'+esc(u.jurusan||'')+'" readonly></div><div class="field"><label>Tempat PKL</label><input value="'+esc(x.name)+'" readonly></div><div class="field"><label>Tanggal pengajuan</label><input id="tgl" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div><div class="field"><label>Catatan</label><textarea id="catatan" placeholder="Catatan tambahan (opsional)"></textarea></div><button class="btn amber">Kirim Pengajuan</button></form>')}
function submitApplication(e,pid){e.preventDefault();const u=me(),x=get('tempatPKL').find(a=>a.id===pid),a=get('pengajuan');a.unshift({id:uid('a'),userId:u.id,userName:u.name,nis:document.getElementById('nis').value,jurusan:u.jurusan,placeId:pid,placeName:x.name,date:document.getElementById('tgl').value,note:document.getElementById('catatan').value,status:'Menunggu',reason:''});set('pengajuan',a);notify(u.id,'Pengajuan PKL dikirim','Pengajuan ke '+x.name+' sedang menunggu pemeriksaan guru.');closeModal();toast('Pengajuan berhasil dikirim');route('pengajuanSaya')}

function savePlace(e,id){e.preventDefault();const a=get('tempatPKL'),obj={id:id||uid('p'),name:pn.value,location:pl.value,city:pl.value.split(',').pop().trim(),field:pf.value,jurusan:pj.value.split(',').map(x=>x.trim()).filter(Boolean),status:ps.value,description:pd.value||'Belum tersedia',activities:pa.value||'Belum tersedia',requirements:pr.value||'Belum tersedia',quota:pq.value||'Tidak dicantumkan',source:'Data yang dimasukkan Guru Pembimbing/Admin; penerimaan PKL perlu dikonfirmasi sekolah.',active:id?(a.find(x=>x.id===id)?.active??true):true};const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);set('tempatPKL',a);closeModal();toast('Data tempat PKL tersimpan');renderPage('kelola')}

function reviewForm(){openModal('Ulasan & Rating','<form onsubmit="saveReview(event)"><div class="field"><label>Tempat PKL</label><select id="rp">'+get('tempatPKL').filter(x=>x.active).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Rating</label><select id="rr"><option value="5">5 - Sangat baik</option><option value="4">4 - Baik</option><option value="3">3 - Cukup</option><option value="2">2 - Kurang</option><option value="1">1 - Sangat kurang</option></select></div><div class="field"><label>Ulasan</label><textarea id="rt" required></textarea></div><button class="btn amber">Kirim Ulasan</button></form>')}
function saveReview(e){e.preventDefault();const x=get('tempatPKL').find(x=>x.id===rp.value),a=get('ulasan');a.unshift({id:uid('r'),userId:me().id,userName:me().name,placeId:x.id,placeName:x.name,rating:+rr.value,text:rt.value});set('ulasan',a);closeModal();toast('Ulasan berhasil dikirim');renderPage('ulasan')}
function notifications(p){const a=get('notifikasi').filter(x=>x.userId===me().id);p.innerHTML='<div class="page-head"><div><h1>Notifikasi</h1><div class="muted">Informasi terbaru tentang aktivitas PKL.</div></div><button class="btn" onclick="readAll()">Tandai semua dibaca</button></div><div class="card">'+(a.length?a.map(x=>'<div class="list-item" style="'+(x.read?'opacity:.65':'')+'"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>'+esc(x.title)+'</b><p>'+esc(x.message)+'</p><small class="muted">'+new Date(x.date).toLocaleString('id-ID')+'</small></div>'+(!x.read?'<button class="btn small" onclick="readOne(\''+x.id+'\')">Baca</button>':'')+'</div></div>').join(''):'<div class="empty">Tidak ada notifikasi.</div>')+'</div>'}
function readOne(id){const a=get('notifikasi'),x=a.find(n=>n.id===id);if(x)x.read=true;set('notifikasi',a);renderPage('notifikasi')}
function readAll(){const a=get('notifikasi');a.forEach(n=>{if(n.userId===me().id)n.read=true});set('notifikasi',a);renderPage('notifikasi')}
function profile(p){const u=me();p.innerHTML='<div class="page-head"><div><h1>Profil</h1><div class="muted">Kelola informasi akun Anda.</div></div></div><div class="card"><div class="profile"><div><div class="profile-avatar">'+initials(u.name)+'</div><p class="muted">'+roleName(u.role)+'</p></div><form onsubmit="saveProfile(event)"><div class="field"><label>Nama</label><input id="un" value="'+esc(u.name)+'" required></div><div class="field"><label>Email</label><input value="'+esc(u.email)+'" readonly></div><div class="field"><label>NIS/NISN</label><input id="ui" value="'+esc(u.nis||'')+'" '+(u.role==='siswa'?'':'disabled')+'></div><div class="field"><label>Jurusan</label><input id="uj" value="'+esc(u.jurusan||'')+'" '+(u.role==='siswa'?'':'disabled')+'></div><div class="field"><label>Role</label><input value="'+roleName(u.role)+'" readonly></div><button class="btn amber">Simpan Perubahan</button></form></div></div>'}
function saveProfile(e){e.preventDefault();const users=get('users'),u=me(),x=users.find(a=>a.id===u.id);x.name=un.value;x.nis=u.role==='siswa'?ui.value:u.nis;x.jurusan=u.role==='siswa'?uj.value:u.jurusan;delete x.password;const fresh={...u,name:x.name,nis:x.nis,jurusan:x.jurusan};set('users',users);set('currentUser',fresh);toast('Profil berhasil diperbarui');renderPage('profil')}
function openModal(title,body,foot=''){document.getElementById('modalRoot').innerHTML='<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3 style="margin:0">'+title+'</h3><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body">'+body+'</div>'+(foot?'<div class="modal-foot">'+foot+'</div>':'')+'</div></div>';lucide.createIcons()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function start(){seed();const u=me();if(!u)return showLogin();let page=location.hash.slice(1)||'dashboard';if(!allowed(page))page='dashboard';renderPage(page)}
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1)||'dashboard';if(me())renderPage(allowed(p)?p:'dashboard')});start();
</script>
</body>
</html>
